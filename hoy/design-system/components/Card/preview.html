<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap"><meta charset="utf-8"><link rel="stylesheet" href="../bundle.css"></head>
<body>
<div class="ds-stage" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-lg)">
  <div class="card">
    <span class="eyebrow">Hoy · martes</span>
    <h3 class="card-title" style="margin-top:var(--sp-xs)">Check-in de hoy</h3>
    <div style="margin-top:var(--sp-md)">
      <div class="card-row"><span>07:00 · Hatha</span><span class="muted">14 / 16</span></div>
      <div class="card-row"><span>09:30 · Vinyasa</span><span class="muted">9 / 16</span></div>
      <div class="card-row"><span>18:00 · Hot yoga</span><span class="muted">16 / 16</span></div>
    </div>
  </div>
  <div class="card card-primary">
    <span class="eyebrow">Próxima clase</span>
    <h2 class="editorial" style="font-size:1.75rem;line-height:1.15;margin-top:var(--sp-xs)">Vinyasa al amanecer</h2>
    <p style="margin:var(--sp-sm) 0 var(--sp-lg);font-size:.875rem">09:30 · Sala Río · con Carolina</p>
    <button class="btn btn-secondary">Ver detalles</button>
  </div>
</div>
</body></html>
