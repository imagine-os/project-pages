<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HoyOS Hub Layouts</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>
:root{--bg:#f3f4f6;--surface:#fff;--fg:#151a22;--muted:#5b6474;--line:#dde1e7;--chip:#eef1f5;--c:#c2552d;
--f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;--f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--surface:#171b23;--fg:#e7eaf0;--muted:#98a1b2;--line:#283040;--chip:#212836}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body)}
.wrap{max-width:1240px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left)) 72px}
.crumb{font:12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.crumb a{color:var(--c);text-decoration:none}
h1{font:700 clamp(30px,5vw,46px)/1.05 var(--f-display);letter-spacing:-.02em;margin:10px 0 8px;text-wrap:balance}
h2{font:700 24px/1.15 var(--f-display);margin:44px 0 14px;padding-bottom:10px;border-bottom:3px solid var(--c)}
h3{font:600 17px var(--f-display);margin:0}
.lede{color:var(--muted);max-width:70ch;margin:0}.note{font-size:13px;color:var(--muted);margin-top:10px}
a{color:var(--c)}code{font:12.5px var(--f-mono);background:var(--chip);padding:1px 5px;border-radius:4px}
</style><style>.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:22px;margin-top:28px}
.bd{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.bd figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}.bd figcaption a{font-size:13px;font-weight:600;text-decoration:none}
.frame{position:relative;width:100%;aspect-ratio:var(--w)/var(--h);overflow:hidden;border-radius:8px;background:var(--chip)}
.frame iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}</style>
