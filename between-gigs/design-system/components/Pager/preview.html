<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script><script src="../bundle.js"></script>
<meta charset="utf-8">
<title>Pager</title>
</head>
<body>
<div id="root"></div>
<script>
const { useState } = React;
const BG = window.BetweenGigs;
const { html, Icons: I } = BG;
function Demo() {
  const { Pager } = BG;
  const names = ["Connected work", "Table Studio", "Feature reminders", "Project management", "Spec Builder"];
  const [p, setP] = useState(1);
  return html`<div className="flex justify-center p-6"><${Pager} page=${p} pageCount=${names.length} onChange=${setP} itemLabel=${names[p - 1]} /></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Demo));
</script>
</body>
</html>
